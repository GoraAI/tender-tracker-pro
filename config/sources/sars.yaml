# SARS - South African Revenue Service Tenders
# Source: www.sars.gov.za/procurement/published-tenders/

source:
  id: "sars"
  name: "SARS - South African Revenue Service"
  enabled: true
  priority: "P0"

  # Source metadata
  organization: "South African Revenue Service"
  description: "Published Tenders and RFPs"
  website: "https://www.sars.gov.za/"

# URLs
urls:
  main_site: "https://www.sars.gov.za/"
  rfq_listing: "https://www.sars.gov.za/procurement/published-tenders/"

# Navigation configuration
navigation:
  # Method: browser_navigation (primary) or html_scraping (fallback)
  method: "browser_navigation"

  # Browser settings
  browser:
    type: "chromium"
    headless: true
    viewport:
      width: 1920
      height: 1080
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

  # Navigation steps
  steps:
    - action: "goto"
      url: "${urls.rfq_listing}"
      wait_for: "networkidle"
      timeout_ms: 30000

    - action: "wait_for_selector"
      selector: "a[href*='/tender/']"
      timeout_ms: 10000
      optional: false

  # Human-like behavior
  delays:
    min_ms: 1000
    max_ms: 3000
    between_downloads_ms: 2000

  # Pagination
  pagination:
    enabled: false  # SARS shows all current tenders on one page

# PDF Discovery
pdf_discovery:
  # Pattern matching for tender detail pages
  patterns:
    # Tender detail pages
    - regex: "/tender/rfp\\d+-\\d+-.+"
    # Direct PDF links if found
    - regex: ".*\\.pdf$"
    - regex: ".*\\.zip$"  # SARS often packages PDFs in ZIP files

  # Link attributes to extract
  extract:
    - attribute: "href"
      name: "url"
    - attribute: "innerText"
      name: "link_text"
    - attribute: "title"
      name: "title"
      optional: true

  # Context extraction (tender details from listing table)
  extract_context:
    enabled: true
    parent_selector: "tr"  # Table row context
    max_length: 500

  # Deduplication key
  dedup_key: "url"

  # Filtering
  exclude_patterns:
    - ".*archive.*"
    - ".*cancelled.*"
    - ".*withdrawn.*"

# Download Configuration
download:
  # Storage path template
  path_template: "documents/downloads/${source.id}/${year}-${month}/${filename}"

  # Download method
  method: "auto"  # Will handle both direct PDFs and ZIPs

  # Validation
  validate:
    min_size_bytes: 1000
    max_size_mb: 100  # SARS tender packs can be large
    check_pdf_header: true

  # Retry logic
  retry_attempts: 3
  retry_delay_ms: 5000
  retry_on_errors:
    - "NetworkError"
    - "TimeoutError"
    - "DownloadError"

  # Concurrency
  max_concurrent: 2

  # Skip existing
  skip_existing: true
  compare_by: "size_and_name"

# Fallback Scraping (when navigation fails)
fallback:
  enabled: true
  trigger_after_failures: 3

  # Scraper configuration
  scraper:
    method: "requests_beautifulsoup"
    parser: "lxml"
    timeout_seconds: 30

    # CSS selectors for fallback
    selectors:
      tender_links: "a[href*='/tender/']"
      tender_rows: "table tr"
      closing_date: "td:contains('Closing Date')"

    # Headers
    headers:
      User-Agent: "TenderTracker/1.0 (Compliance; contact@tendertracker.example.com)"
      Accept: "text/html,application/xhtml+xml"

  # Recovery
  recovery_hours: 24
  alert_on_activation: true

# Scheduling
schedule:
  # Cron expression: every 6 hours
  cron: "0 */6 * * *"

  # Timezone
  timezone: "Africa/Johannesburg"

  # Skip on holidays
  skip_holidays: false

# Monitoring
monitoring:
  # Alert conditions
  alert_on_consecutive_failures: 2
  alert_on_zero_results: true
  alert_on_slow_response: 60

  # Screenshots
  screenshot_on_error: true
  screenshot_path: "logs/screenshots/${source.id}_${timestamp}.png"

  # Metrics
  track_metrics:
    - "response_time_ms"
    - "tender_count"
    - "download_success_rate"
    - "extraction_time_ms"

# Expected patterns (for validation)
expected:
  min_tenders_per_scrape: 0
  max_tenders_per_scrape: 20  # SARS usually has 5-15 active tenders

  # Typical file sizes
  typical_pdf_size_kb:
    min: 100
    max: 20000  # Tender packs can be large

  # File naming pattern
  filename_pattern: "RFP\\d+.\\d+.*"

# Text Extraction Configuration
extraction:
  # Extraction method
  method: "auto"

  # OCR settings
  ocr_language: "eng"
  ocr_confidence_threshold: 0.7

  # Validation
  min_text_length: 100

  # Performance
  max_concurrent: 3

  # Caching
  skip_existing: true

  # Output
  output_base_path: "documents/extracted"

  # Special handling for ZIP files
  handle_archives:
    enabled: true
    extract_all: true
    exclude_patterns:
      - ".*__MACOSX.*"
      - ".*\\.DS_Store"
